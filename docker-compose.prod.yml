# Heimdall production stack. On Coolify, deploy it as a "Docker Compose"
# resource with build context = repo root and compose file =
# /docker-compose.prod.yml, and assign your domain to the `app` service
# (port 3000). On another Docker host, put a reverse proxy in front of `app`.
#
# No `networks:` block on purpose: Coolify creates a per-resource network and
# attaches Traefik to it. A custom network leaves Traefik unable to route and
# produces intermittent 504s.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: "postgres://heimdall:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/heimdall"
      # Auth.js resolves trustHost from AUTH_URL/AUTH_TRUST_HOST/VERCEL/CF_PAGES.
      # None are set off Vercel, so without these two every sign-in fails with
      # UntrustedHost. See @auth/core lib/utils/env.js. AUTH_URL is required:
      # an empty value counts as set there and turns AUTH_TRUST_HOST off.
      AUTH_URL: "${AUTH_URL:?}"
      AUTH_TRUST_HOST: "true"
      AUTH_SECRET: "${AUTH_SECRET}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET}"
      ALLOWED_EMAIL_DOMAIN: "${ALLOWED_EMAIL_DOMAIN}"
      ALLOWED_EMAILS: "${ALLOWED_EMAILS}"
      GITHUB_TOKEN: "${GITHUB_TOKEN}"
      DATAFORSEO_LOGIN: "${DATAFORSEO_LOGIN}"
      DATAFORSEO_PASSWORD: "${DATAFORSEO_PASSWORD}"
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
      # An ntfy server in a separate Docker network (e.g. its own Coolify
      # resource) is reachable only through its public domain from here.
      NTFY_BASE_URL: "${NTFY_BASE_URL}"
      NTFY_TOKEN: "${NTFY_TOKEN}"
      NTFY_TOPIC: "${NTFY_TOPIC}"
      CRON_SECRET: "${CRON_SECRET}"
    depends_on:
      postgres:
        condition: service_healthy

  # Fires the schedules in crons.json over the internal network, so the jobs keep
  # running when Traefik or DNS is broken and CRON_SECRET never leaves Docker.
  cron:
    build:
      context: .
      dockerfile: Dockerfile
      target: cron
    restart: unless-stopped
    environment:
      APP_URL: "http://app:3000"
      CRON_SECRET: "${CRON_SECRET}"
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heimdall
      POSTGRES_PASSWORD: "${SERVICE_PASSWORD_POSTGRES}"
      POSTGRES_DB: heimdall
    volumes:
      - heimdall-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heimdall -d heimdall"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  heimdall-postgres-data:
